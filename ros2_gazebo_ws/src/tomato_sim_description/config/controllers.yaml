controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    slide_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    drive_wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: position_controllers/JointGroupPositionController

slide_velocity_controller:
  ros__parameters:
    joints: [machine_slide]

drive_wheel_velocity_controller:
  ros__parameters:
    joints: [act_left_joint, act_right_joint]

arm_trajectory_controller:
  ros__parameters:
    joints: [shoulder_joint, upperArm_joint, foreArm_joint, wrist1_joint, wrist2_joint, wrist3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.02

gripper_controller:
  ros__parameters:
    joints: [gripper_joint]
